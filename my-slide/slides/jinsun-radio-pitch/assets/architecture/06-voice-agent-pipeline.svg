<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">多 Agent 語音流程</title><desc id="desc">長輩語音經 ASR、意圖路由與六個 Agent 處理，再同步資料庫和裝置回應。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.l{font-size:22px}.sm{font-size:17px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font-size:15px;fill:#9A4A08}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 06 / VOICE AGENT</text><text x="88" y="137" class="t">不是一個聊天機器人，是一組照護 Agent</text><text x="88" y="181" class="sub">每個 Agent 只負責一件事；狀態機和資料層負責把回應變成行動。</text>
<rect x="80" y="265" width="270" height="610" rx="26" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="112" y="312" font-size="27" fill="#F96C1A" font-family="Noto Sans TC">輸入</text><g filter="url(#s)"><rect x="112" y="370" width="206" height="150" rx="22" class="card"/><rect x="142" y="400" width="65" height="65" rx="16" fill="#4D9630"/><path d="M156 446c17-27 39-21 45-5 6 15-10 26-23 20-11-5-21-4-27 4" fill="none" stroke="#fff" stroke-width="6"/><text x="228" y="425" class="l">收音機</text><text x="228" y="456" class="sm">語音／事件</text><text x="142" y="495" class="sm">device_serial</text></g><g filter="url(#s)"><rect x="112" y="585" width="206" height="150" rx="22" class="card"/><rect x="142" y="615" width="65" height="65" rx="16" fill="#3A8DCC"/><path d="M155 650c0-19 27-30 44-14 17-4 28 20 12 31h-58c-12-8-8-17 2-17z" fill="none" stroke="#fff" stroke-width="5"/><text x="228" y="640" class="l">ASR</text><text x="228" y="671" class="sm">Breeze ASR</text><text x="142" y="710" class="sm">轉成繁中逐字稿</text></g><path class="arr" d="M360 575H410"/>
<rect x="430" y="265" width="320" height="610" rx="26" class="z" fill="#EAF4FC"/><text x="462" y="312" font-size="27" fill="#0E6EA8" font-family="Noto Sans TC">理解與路由</text><g filter="url(#s)"><rect x="462" y="390" width="256" height="190" rx="24" fill="#fff" stroke="#A7CDEA" stroke-width="2"/><rect x="494" y="425" width="72" height="72" rx="16" fill="#6E4DB7"/><path d="M510 468c8-21 34-24 43-6 13 1 15 19 2 26h-44c-12-5-11-17-1-20z" fill="#fff"/><text x="590" y="446" class="l">Amazon</text><text x="590" y="476" class="l">Bedrock</text><text x="494" y="535" class="sm">意圖分類／信心分數</text></g><g><rect x="462" y="635" width="256" height="130" rx="22" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="494" y="685" class="l">意圖路由</text><text x="494" y="720" class="sm">SOS／跌倒／物資／聊天</text></g><path class="arr" d="M760 575H805"/>
<rect x="825" y="265" width="625" height="610" rx="26" class="z"/><text x="857" y="312" font-size="27" fill="#0E6EA8" font-family="Noto Sans TC">六個專責 Agent</text><g filter="url(#s)"><rect x="857" y="365" width="178" height="132" rx="20" fill="#fff" stroke="#F4C18F" stroke-width="2"/><text x="887" y="412" class="l">Intent</text><text x="887" y="449" class="sm">意圖分類</text></g><g filter="url(#s)"><rect x="1052" y="365" width="178" height="132" rx="20" fill="#fff" stroke="#E5484D" stroke-width="2"/><text x="1082" y="412" class="l">Emergency</text><text x="1082" y="449" class="sm">緊急升級</text></g><g filter="url(#s)"><rect x="1247" y="365" width="171" height="132" rx="20" fill="#fff" stroke="#FFB14D" stroke-width="2"/><text x="1277" y="412" class="l">Needs</text><text x="1277" y="449" class="sm">物資需求</text></g><g filter="url(#s)"><rect x="857" y="535" width="178" height="132" rx="20" fill="#fff" stroke="#A7CDEA" stroke-width="2"/><text x="887" y="582" class="l">Conversation</text><text x="887" y="619" class="sm">對話安撫</text></g><g filter="url(#s)"><rect x="1052" y="535" width="178" height="132" rx="20" fill="#fff" stroke="#A9D9B7" stroke-width="2"/><text x="1082" y="582" class="l">Device</text><text x="1082" y="619" class="sm">裝置指令</text></g><g filter="url(#s)"><rect x="1247" y="535" width="171" height="132" rx="20" fill="#fff" stroke="#CBB6D5" stroke-width="2"/><text x="1277" y="582" class="l">Memory</text><text x="1277" y="619" class="sm">個人脈絡</text></g><g><rect x="857" y="720" width="561" height="90" rx="18" fill="#F5F1EC"/><text x="887" y="775" class="sm">共同使用：事件模型／派遣狀態／長輩偏好語言</text></g><path class="arr" d="M1460 575H1510"/>
<rect x="1530" y="265" width="310" height="610" rx="26" class="z"/><text x="1562" y="312" font-size="27" fill="#0E6EA8" font-family="Noto Sans TC">行動輸出</text><g filter="url(#s)"><rect x="1562" y="365" width="246" height="112" rx="20" fill="#E8F5EC" stroke="#A9D9B7" stroke-width="2"/><text x="1592" y="410" class="l">資料寫入</text><text x="1592" y="445" class="sm">Aurora／Supabase</text></g><g filter="url(#s)"><rect x="1562" y="520" width="246" height="112" rx="20" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="1592" y="565" class="l">裝置回應</text><text x="1592" y="600" class="sm">MQTT／TTS</text></g><g filter="url(#s)"><rect x="1562" y="675" width="246" height="112" rx="20" fill="#EAF4FC" stroke="#A7CDEA" stroke-width="2"/><text x="1592" y="720" class="l">通知派遣</text><text x="1592" y="755" class="sm">App／FCM／志工</text></g><text x="88" y="1010" class="sm">核心：Agent 產生回覆，狀態機決定是否升級、派遣、播報與留下紀錄。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>