<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">AWS 部署拓撲</title><desc id="desc">四個 Flutter Web 站台部署到 S3 和 CloudFront，後端經 API Gateway、Lambda、Aurora、DynamoDB 與 IoT Core。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.z{fill:#fff;stroke:#D9D1C8;stroke-width:2;stroke-dasharray:9 7}.zt{font-size:27px;fill:#0E6EA8}.l{font-size:22px}.sm{font-size:18px;fill:#5A5147}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.tag{font-size:16px;fill:#9A4A08}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 03 / AWS 部署</text><text x="88" y="137" class="t">AWS：把長駐、事件與靜態站台拆開</text><text x="88" y="181" class="sub">Web 內容走 CloudFront；語音與事件走 API Gateway；資料各自放在適合的服務。</text>
<rect x="80" y="245" width="420" height="650" rx="26" class="z"/><text x="112" y="290" class="zt">使用者端・S3＋CloudFront</text><text x="112" y="323" class="sm">Flutter Web 四個獨立站台</text><g filter="url(#s)"><rect x="112" y="370" width="170" height="130" rx="20" class="card"/><rect x="137" y="397" width="58" height="58" rx="14" fill="#4D9630"/><path d="M148 408c0-6 30-6 36 0v22c0 8-36 8-36 0zM148 408c0 7 36 7 36 0M148 420c0 7 36 7 36 0" fill="none" stroke="#fff" stroke-width="4"/><text x="210" y="420" class="l">S3</text><text x="137" y="480" class="sm">靜態檔</text></g><g filter="url(#s)"><rect x="312" y="370" width="156" height="130" rx="20" class="card"/><rect x="337" y="397" width="58" height="58" rx="14" fill="#E56A91"/><circle cx="366" cy="426" r="18" fill="none" stroke="#fff" stroke-width="4"/><path d="M366 408v36m-18-18h36" stroke="#fff" stroke-width="4"/><text x="410" y="420" class="l">CloudFront</text><text x="337" y="480" class="sm">HTTPS／CDN</text></g><g><rect x="112" y="550" width="356" height="230" rx="20" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="142" y="598" class="l">四個 Web 端</text><text x="142" y="642" class="sm">家屬 App</text><text x="142" y="680" class="sm">志工 App</text><text x="142" y="718" class="sm">社工 Web</text><text x="142" y="756" class="sm">長輩端收音機</text></g>
