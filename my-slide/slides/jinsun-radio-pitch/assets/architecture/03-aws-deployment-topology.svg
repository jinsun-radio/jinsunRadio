<rect x="1540" y="245" width="300" height="650" rx="26" class="z"/><text x="1572" y="290" class="zt">裝置下行</text><text x="1572" y="323" class="sm">物聯網與身分</text><g filter="url(#s)"><rect x="1572" y="370" width="236" height="140" rx="20" class="card"/><rect x="1600" y="402" width="62" height="62" rx="15" fill="#4D9630"/><path d="M1612 438c5-22 36-23 42-4 14-3 20 20 4 25h-41c-14-4-12-20-5-21z" fill="none" stroke="#fff" stroke-width="5"/><text x="1684" y="428" class="l">IoT Core</text><text x="1684" y="460" class="sm">X.509 MQTT</text></g><g filter="url(#s)"><rect x="1572" y="560" width="236" height="140" rx="20" class="card"/><rect x="1600" y="592" width="62" height="62" rx="15" fill="#FF9900"/><path d="M1624 608l10 21 11-21m-17 21l-11 20m17-20l12 20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><text x="1684" y="618" class="l">Speak Lambda</text><text x="1684" y="650" class="sm">播放指令</text></g><path class="arr" d="M500 435H550"/><path class="arr" d="M990 435H1040"/><path class="arr" d="M1480 435H1530"/><path class="arr" d="M1480 620H1530"/><path class="arr" d="M1480 620H1530"/><text x="88" y="1010" class="sm">推薦部署：S3／CloudFront 負責靜態 Web，ECS Fargate 負責需要長駐 timer 與 MQTT 的語音服務。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>