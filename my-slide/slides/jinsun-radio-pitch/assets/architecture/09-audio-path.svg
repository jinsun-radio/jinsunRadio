<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">語音上行與下行鏈路</title><desc id="desc">裝置錄音上傳 ASR，Voice Agent 處理意圖，TTS 產生語音，再經 MQTT 回到裝置播放。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.h{font-size:27px}.l{font-size:22px}.sm{font-size:18px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.upl{stroke:#F96C1A;stroke-width:4;fill:none;marker-end:url(#a)}.down{stroke:#1E88D6;stroke-width:4;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 09 / 語音鏈路</text><text x="88" y="137" class="t">一句話的完整旅程：錄音 → 理解 → 回應</text><text x="88" y="181" class="sub">上行是長輩的聲音，下行是系統真的做出的下一步。</text>
<rect x="80" y="260" width="1760" height="280" rx="28" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="120" y="315" class="h" fill="#F96C1A">上行・長輩主動說話</text><g filter="url(#s)"><rect x="120" y="360" width="250" height="120" rx="20" class="card"/><rect x="150" y="390" width="60" height="60" rx="15" fill="#4D9630"/><path d="M165 432c15-25 36-19 41-5 6 14-9 24-21 19-10-5-19-4-25 3" fill="none" stroke="#fff" stroke-width="6"/><text x="232" y="411" class="l">麥克風</text><text x="232" y="443" class="sm">PDM／16kHz</text></g><path class="upl" d="M380 420H455"/><g filter="url(#s)"><rect x="465" y="360" width="260" height="120" rx="20" class="card"/><rect x="495" y="390" width="60" height="60" rx="15" fill="#3A8DCC"/><path d="M508 421c0-18 26-28 43-13 14-3 24 17 10 28h-47c-10-6-7-15-6-15z" fill="none" stroke="#fff" stroke-width="5"/><text x="580" y="411" class="l">Breeze ASR</text><text x="580" y="443" class="sm">XCC Gateway</text></g><path class="upl" d="M735 420H810"/><g filter="url(#s)"><rect x="820" y="360" width="280" height="120" rx="20" class="card"/><rect x="850" y="390" width="60" height="60" rx="15" fill="#6E4DB7"/><path d="M862 423c6-17 27-19 35-5 10 1 12 15 1 21h-37c-10-4-9-14 1-16z" fill="#fff"/><text x="935" y="411" class="l">POST /voice</text><text x="935" y="443" class="sm">Intent／Emergency</text></g><path class="upl" d="M1110 420H1185"/><g filter="url(#s)"><rect x="1195" y="360" width="250" height="120" rx="20" class="card"/><rect x="1225" y="390" width="60" height="60" rx="15" fill="#FF9900"/><path d="M1248 406l10 22 11-22m-17 22l-11 21m17-21l12 21" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><text x="1310" y="411" class="l">Lambda／Agent</text><text x="1310" y="443" class="sm">意圖→行動</text></g><path class="upl" d="M1455 420H1530"/><g filter="url(#s)"><rect x="1540" y="360" width="260" height="120" rx="20" class="card"/><rect x="1570" y="390" width="60" height="60" rx="15" fill="#3ECF8E"/><path d="M1582 407h37l-22 21h21l-24 22 7