<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HUB8735 ultra 與 MAX98357A 硬體接線圖</title>
  <desc id="desc">金孫收音機長輩端的 HUB8735 ultra、MAX98357A I2S 功放、喇叭、板載 PDM 麥克風、MicroSD 與觸發按鈕接線說明。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17251b" flood-opacity=".18"/></filter>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5c9d5d"/><stop offset=".55" stop-color="#2f713f"/><stop offset="1" stop-color="#1f5737"/></linearGradient>
    <linearGradient id="amp" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6f2e85"/><stop offset="1" stop-color="#34144f"/></linearGradient>
    <linearGradient id="speaker" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151515"/><stop offset=".55" stop-color="#4a4a4a"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
    <style><![CDATA[
      text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#171b18}
      .title{font-size:42px;font-weight:900}.subtitle{font-size:21px;fill:#58625b}
      .panel-title{font-size:25px;font-weight:900}.body{font-size:19px}.small{font-size:16px;fill:#4d5750}
      .pin{font-size:15px;fill:#eef8ed}.board-label{font-size:21px;fill:#d9efdb;font-weight:900}
      .wire-label{font-size:15px;font-weight:900}.note{font-size:17px;fill:#4b554d}
    ]]></style>
  </defs>
  <rect width="1920" height="1080" fill="#fcfbf9"/>
  <rect width="1920" height="11" fill="#F96C1A"/>
  <text x="60" y="67" class="title">HUB8735 ultra 硬體接線圖</text>
  <text x="60" y="101" class="subtitle">金孫收音機長輩端：I2S 音訊輸出、板載 PDM 麥克風、MicroSD 錄音暫存與實體觸發按鈕</text>

  <!-- Speaker -->
  <g filter="url(#shadow)">
    <rect x="62" y="150" width="270" height="270" rx="24" fill="#242424"/>
    <circle cx="197" cy="285" r="102" fill="url(#speaker)" stroke="#c8c8c8" stroke-width="13"/>
    <circle cx="197" cy="285" r="73" fill="#121212" stroke="#555" stroke-width="4"/>
    <circle cx="197" cy="285" r="27" fill="#080808" stroke="#303030" stroke-width="4"/>
    <circle cx="92" cy="180" r="9" fill="#e4e4e4"/><circle cx="302" cy="180" r="9" fill="#e4e4e4"/>
    <circle cx="92" cy="390" r="9" fill="#e4e4e4"/><circle cx="302" cy="390" r="9" fill="#e4e4e4"/>
  </g>
  <text x="70" y="137" class="panel-title">36mm 3W 4Ω Speaker</text>

  <!-- MAX amp -->
  <g filter="url(#shadow)">
    <rect x="76" y="520" width="265" height="205" rx="20" fill="url(#amp)" stroke="#1d1330" stroke-width="4"/>
    <rect x="95" y="538" width="227" height="52" rx="9" fill="#3b1b51" stroke="#b889c8" stroke-width="2"/>
    <text x="108" y="559" class="board-label" font-size="20">MAX98357A</text><text x="108" y="580" class="pin">I2S Amp</text>
    <circle cx="109" cy="681" r="16" fill="#e9edf2" stroke="#8f9bab" stroke-width="4"/><circle cx="159" cy="681" r="16" fill="#e9edf2" stroke="#8f9bab" stroke-width="4"/><circle cx="209" cy="681" r="16" fill="#e9edf2" stroke="#8f9bab" stroke-width="4"/><circle cx="259" cy="681" r="16" fill="#e9edf2" stroke="#8f9bab" stroke-width="4"/><circle cx="309" cy="681" r="16" fill="#e9edf2" stroke="#8f9bab" stroke-width="4"/>
    <text x="94" y="714" class="pin">BCLK</text><text x="143" y="714" class="pin">GAIN</text><text x="195" y="714" class="pin">LRC</text><text x="247" y="714" class="pin">DIN</text><text x="296" y="714" class="pin">SD</text>
    <text x="93" y="646" class="pin">−</text><text x="297" y="646" class="pin">+</text><circle cx="105" cy="645" r="10" fill="#111"/><circle cx="312" cy="645" r="10" fill="#e14e2d"/>
  </g>
  <text x="80" y="753" class="small">MAX98357A I2S 功放</text>

  <!-- Main board -->
  <g filter="url(#shadow)">
    <rect x="485" y="143" width="505" height="800" rx="16" fill="url(#board)" stroke="#173b27" stroke-width="7"/>
    <rect x="536" y="215" width="402" height="252" rx="8" fill="#9a9c9a" opacity=".8"/>
    <rect x="540" y="219" width="394" height="244" rx="6" fill="#b8b9b6" opacity=".56"/>
    <text x="652" y="540" class="board-label">HUB 8735 ultra</text>
    <rect x="600" y="582" width="275" height="54" rx="7" fill="#161b17"/>
    <rect x="612" y="627" width="250" height="33" rx="4" fill="#ecf0eb"/>
    <!-- buttons and sockets -->
    <rect x="604" y="705" width="49" height="54" rx="8" fill="#f5f5f5" stroke="#d2d2d2" stroke-width="3"/><circle cx="628" cy="731" r="15" fill="#252525"/>
    <rect x="790" y="695" width="73" height="74" rx="12" fill="#f5f5f5" stroke="#d2d2d2" stroke-width="3"/><circle cx="826" cy="732" r="24" fill="#f4c51a"/>
    <rect x="596" y="790" width="113" height="102" rx="8" fill="#e5e6e2"/><rect x="747" y="790" width="113" height="102" rx="8" fill="#e5e6e2"/>
    <rect x="636" y="800" width="30" height="13" rx="4" fill="#171717"/><rect x="787" y="800" width="30" height="13" rx="4" fill="#171717"/>
    <rect x="718" y="830" width="20" height="32" rx="3" fill="#d9342b"/>
    <!-- left pins -->
    <g fill="#d7d8ba" stroke="#243b2b" stroke-width="3"><circle cx="527" cy="182" r="12"/><circle cx="527" cy="226" r="12"/><circle cx="527" cy="270" r="12"/><circle cx="527" cy="314" r="12"/><circle cx="527" cy="358" r="12"/><circle cx="527" cy="402" r="12"/><circle cx="527" cy="446" r="12"/><circle cx="527" cy="490" r="12"/><circle cx="527" cy="534" r="12"/><circle cx="527" cy="578" r="12"/><circle cx="527" cy="622" r="12"/><circle cx="527" cy="666" r="12"/><circle cx="527" cy="710" r="12"/><circle cx="527" cy="754" r="12"/></g>
    <g class="pin"><text x="548" y="187">5V</text><text x="548" y="231">GND</text><text x="548" y="275">0</text><text x="548" y="319">1</text><text x="548" y="363">2</text><text x="548" y="407">3</text><text x="548" y="451">4</text><text x="548" y="495">5</text><text x="548" y="539">6</text><text x="548" y="583">7</text><text x="548" y="627">8</text><text x="548" y="671">9</text><text x="548" y="715">10</text><text x="548" y="759">11</text></g>
    <!-- right pins -->
    <g fill="#d7d8ba" stroke="#243b2b" stroke-width="3"><circle cx="948" cy="182" r="12"/><circle cx="948" cy="226" r="12"/><circle cx="948" cy="270" r="12"/><circle cx="948" cy="314" r="12"/><circle cx="948" cy="358" r="12"/><circle cx="948" cy="402" r="12"/><circle cx="948" cy="446" r="12"/><circle cx="948" cy="490" r="12"/><circle cx="948" cy="534" r="12"/><circle cx="948" cy="578" r="12"/><circle cx="948" cy="622" r="12"/><circle cx="948" cy="666" r="12"/><circle cx="948" cy="710" r="12"/><circle cx="948" cy="754" r="12"/></g>
    <g class="pin" text-anchor="end"><text x="923" y="187">3.3V</text><text x="923" y="231">14</text><text x="923" y="275">15</text><text x="923" y="319">VCC</text><text x="923" y="363">GND</text><text x="923" y="407">16</text><text x="923" y="451">17</text><text x="923" y="495">18</text><text x="923" y="539">19</text><text x="923" y="583">21</text><text x="923" y="627">22</text><text x="923" y="671">23</text><text x="923" y="715">24</text><text x="923" y="759">SPK</text></g>
  </g>
  <text x="638" y="126" class="panel-title">HUB8735 ultra</text>

  <!-- colored wires from amp/board -->
  <path d="M109 681 V465 H450 V754 H515" fill="none" stroke="#2769d6" stroke-width="6"/>
  <path d="M159 681 V445 H468 V710 H515" fill="none" stroke="#e9b400" stroke-width="6"/>
  <path d="M209 681 V425 H450 V666 H515" fill="none" stroke="#2e9b55" stroke-width="6"/>
  <path d="M259 681 V405 H430 V622 H515" fill="none" stroke="#e34c35" stroke-width="6"/>
  <path d="M309 681 V385 H410 V578 H515" fill="none" stroke="#f07b25" stroke-width="6"/>
  <path d="M197 390 V475 H448 V226 H515" fill="none" stroke="#161616" stroke-width="6"/>
  <path d="M197 180 V165 H470 V182 H515" fill="none" stroke="#f04425" stroke-width="6"/>
  <text x="387" y="740" class="wire-label" fill="#2769d6">BCLK → D24</text><text x="388" y="696" class="wire-label" fill="#d09200">LRC → D12</text><text x="380" y="652" class="wire-label" fill="#2e9b55">DIN → D11</text><text x="370" y="608" class="wire-label" fill="#d13d2c">SD → D10</text>

  <!-- I2S panel -->
  <g transform="translate(1060 145)"><rect width="790" height="290" rx="18" fill="#f7fbff" stroke="#4478ca" stroke-width="3"/><text x="30" y="48" class="panel-title" fill="#2456a2">I2S 接線（MAX98357A）</text>
    <text x="30" y="91" class="body">BCLK（BCLK）</text><text x="410" y="91" class="body" fill="#f07820">→　D24（Pin 24）</text>
    <text x="30" y="134" class="body">LRC（LRCK）</text><text x="410" y="134" class="body" fill="#2456a2">→　D12（Pin 12）</text>
    <text x="30" y="177" class="body">DIN（DIN）</text><text x="410" y="177" class="body" fill="#2e9651">→　D11（Pin 11）</text>
    <text x="30" y="220" class="body">SD_MODE（SD）</text><text x="410" y="220" class="body" fill="#e5ae00">→　D10（Pin 10）</text>
    <text x="30" y="263" class="body">VIN／GND</text><text x="410" y="263" class="body" fill="#d63c2b">→　3.3V（Pin 18）／GND（Pin 17）</text>
  </g>

  <!-- mic panel -->
  <g transform="translate(1060 466)"><rect width="370" height="216" rx="18" fill="#f7fff9" stroke="#42a464" stroke-width="3"/><text x="30" y="48" class="panel-title" fill="#20834a">麥克風（板載 PDM）</text><circle cx="73" cy="113" r="33" fill="#444"/><rect x="57" y="83" width="32" height="58" rx="16" fill="#444"/><path d="M48 118v15c0 34 50 34 50 0v-15M73 164v24M52 188h42" fill="none" stroke="#444" stroke-width="8" stroke-linecap="round"/><text x="130" y="112" class="body">Built-in Digital PDM Mic</text><text x="130" y="147" class="body">AudioSetting(3)</text><text x="130" y="182" class="body">16kHz Mono</text></g>

  <!-- sd panel -->
  <g transform="translate(1460 466)"><rect width="390" height="216" rx="18" fill="#fffaf5" stroke="#f07820" stroke-width="3"/><text x="30" y="48" class="panel-title" fill="#e45f13">SD 卡（MicroSD）</text><rect x="33" y="78" width="61" height="76" rx="7" fill="#262626"/><text x="42" y="99" font-size="12" fill="#f4bc25" font-family="sans-serif">16GB</text><text x="126" y="105" class="body">錄音暫存：test.mp4</text><text x="126" y="143" class="body">提示音：ready.wav</text><text x="126" y="176" class="body">init.wav ／ wait.wav</text></g>

  <!-- button panel -->
  <g transform="translate(1060 716)"><rect width="790" height="210" rx="18" fill="#fbf8ff" stroke="#9464b4" stroke-width="3"/><text x="30" y="47" class="panel-title" fill="#70408e">觸發按鈕（按下觸發）</text><rect x="35" y="78" width="72" height="72" rx="10" fill="#e8e8e8" stroke="#555" stroke-width="3"/><circle cx="71" cy="114" r="23" fill="#303030"/><text x="138" y="103" class="body">D9（Pin 9）↔ GND（Pin 17）</text><text x="138" y="139" class="body">INPUT_PULLUP</text><text x="138" y="175" class="body">Pressed = LOW</text><path d="M71 150 V182 H300 V375 H515" fill="none" stroke="#1b1b1b" stroke-width="5"/></g>

  <!-- warning -->
  <g transform="translate(1060 954)"><rect width="790" height="80" rx="14" fill="#fff8f7" stroke="#e34c35" stroke-width="3"/><text x="25" y="32" class="panel-title" font-size="20" fill="#d43727">注意事項</text><text x="190" y="31" class="note">⚠ MAX98357 使用 D22/D23（內部佔用）</text><text x="190" y="58" class="note">⚠ 板載按鈕在此配置下不可使用　⚠ D13 為閃光燈 PWM，不建議使用</text></g>
  <text x="60" y="1038" class="small">所有音訊資料遵循「按下才錄音、按下才上雲」；影像推論留在 HUB8735 ultra 本地。</text>
</svg>
