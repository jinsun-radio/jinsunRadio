<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Supabase 與 AWS 資料同步比較</title><desc id="desc">相同 BackendClient 介面支援 Supabase Realtime 和 AWS 版本指紋輪詢。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.h{font-size:30px}.l{font-size:22px}.sm{font-size:18px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.pill{font-size:17px;font-weight:800}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 07 / BACKEND ABSTRACTION</text><text x="88" y="137" class="t">同一套 App，兩套雲端資料路線</text><text x="88" y="181" class="sub">jinsun_core 把 UI 與資料來源解耦；切換只改建置參數，不改畫面。</text>
<rect x="80" y="250" width="330" height="640" rx="28" fill="#EAF4FC" stroke="#A7CDEA" stroke-width="2"/><text x="116" y="300" class="h" fill="#0E6EA8">Flutter UI</text><text x="116" y="338" class="sm">Family／Volunteer／Admin／Elder</text><g filter="url(#s)"><rect x="116" y="395" width="258" height="150" rx="22" class="card"/><rect x="148" y="428" width="65" height="65" rx="16" fill="#1E88D6"/><path d="M164 443h33v27h-33zM170 478h22" fill="none" stroke="#fff" stroke-width="5"/><text x="238" y="452" class="l">BackendClient</text><text x="238" y="484" class="sm">同一組介面</text></g><g><rect x="116" y="615" width="258" height="160" rx="22" fill="#fff" stroke="#A7CDEA" stroke-width="2"/><text x="148" y="665" class="l">--dart-define</text><text x="148" y="710" class="sm">BACKEND=supabase</text><text x="148" y="748" class="sm">BACKEND=aws</text></g><path class="arr" d="M420 570H480"/>
<rect x="500" y="250" width="600" height="640" rx="28" class="z"/><text x="536" y="300" class="h" fill="#0E6EA8">抽象層</text><text x="536" y="338" class="sm">createAuth／createBackend</text><g filter="url(#s)"><rect x="536" y="395" width="528" height="130" rx="22" class="card"/><text x="572" y="445" class="l">JinsunBackends</text><text x="572" y="482" class="sm">依設定選擇 AuthRepository 與 BackendClient</text></g><g><rect x="536" y="585" width="240" height="170" rx="22" fill="#E8F5EC" stroke="#A9D9B7" stroke-width="2"/><text x="570" y="635" class="l">SupabaseBackend</text><text x="570" y="675" class="sm">Realtime</text><text x="570" y="710" class="sm">PostgREST</text></g><g><rect x="824" y="585" width="240" height="170" rx="22" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><text x="858" y="635" class="l">AwsBackend</text><text x="858" y="675" class="sm">3 秒輪詢</text><text x="858" y="710" class="sm">version fingerprint</text></g><path class="arr" d="M1108 570H1168"/>
<rect x="1190" y="250" width="650" height="640" rx="28" class="z"/><text x="1226" y="300" class="h" fill="#0E6EA8">兩套資料平面</text><g filter="url(#s)"><rect x="1226" y="370" width="260" height="390" rx="24" fill="#E8F5EC" stroke="#A9D9B7" stroke-width="2"/><rect x="1260" y="410" width="68" height="68" rx="16" fill="#3ECF8E"/><path d="M1275 427h39l-23 22h22l-25 23 7-18h-20z" fill="#fff"/><text x="1350" y="440" class="l">Supabase</text><text x="1260" y="530" class="sm">Postgres</text><text x="1260" y="570" class="sm">Realtime</text><text x="1260" y="610" class="sm">Auth／Storage</text><text x="1260" y="690" class="sm">即時訂閱</text><text x="1260" y="728" class="sm">展示主線</text></g><g filter="url(#s)"><rect x="1540" y="370" width="260" height="390" rx="24" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><rect x="1574" y="410" width="68" height="68" rx="16" fill="#FF9900"/><path d="M1598 426l10 22 11-22m-17 22l-11 21m17-21l12 21" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><text x="1665" y="440" class="l">AWS</text><text x="1574" y="530" class="sm">API Gateway</text><text x="1574" y="570" class="sm">Aurora／DynamoDB</text><text x="1574" y="610" class="sm">Cognito</text><text x="1574" y="690" class="sm">版本指紋輪詢</text><text x="1574" y="728" class="sm">平行環境</text></g><path class="arr" d="M1488 565H1530"/><text x="88" y="1010" class="sm">設計取捨：Supabase 提供較即時的 Realtime；AWS 用可控、簡單的 polling 避免引入 AppSync 耦合。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>