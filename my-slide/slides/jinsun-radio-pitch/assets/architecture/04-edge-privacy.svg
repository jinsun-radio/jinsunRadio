<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">邊緣隱私架構</title><desc id="desc">影像與跌倒推論留在 HUB8735 裝置，只有主動語音或事件上傳雲端。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.z{fill:#fff;stroke:#D9D1C8;stroke-width:2;stroke-dasharray:9 7}.zt{font-size:27px}.l{font-size:23px}.sm{font-size:18px;fill:#5A5147}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 04 / 隱私邊界</text><text x="88" y="137" class="t">影像不出門，求助才上雲</text><text x="88" y="181" class="sub">用「本地推論＋主動上傳」把長輩的知情權做進系統邊界。</text>
<rect x="80" y="245" width="760" height="650" rx="28" fill="#EEF8EE" stroke="#9AD5B0" stroke-width="3" stroke-dasharray="11 8"/><text x="120" y="300" class="zt" fill="#2E9E5B">家中・裝置端</text><text x="120" y="334" class="sm">平常模式：資料留在本地</text><g filter="url(#s)"><rect x="120" y="390" width="300" height="230" rx="24" fill="#fff" stroke="#B8DBBD" stroke-width="2"/><rect x="154" y="425" width="86" height="86" rx="18" fill="#4D9630"/><path d="M171 478c21-32 49-23 55-5 7 19-13 31-29 23-13-6-27-5-34 5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><circle cx="184" cy="460" r="6" fill="#fff"/><circle cx="220" cy="457" r="6" fill="#fff"/><text x="262" y="460" class="l">HUB8735</text><text x="262" y="493" class="sm">Realtek RTL8735B</text><text x="154" y="560" class="sm">麥克風／相機／NPU</text></g><g><rect x="472" y="390" width="320" height="230" rx="24" fill="#fff" stroke="#B8DBBD" stroke-width="2"/><text x="510" y="440" class="l">本地推論</text><text x="510" y="486" class="sm">✓ 跌倒偵測</text><text x="510" y="526" class="sm">✓ 關鍵字／SOS</text><text x="510" y="566" class="sm">✓ 影像不儲存、不外傳</text></g><g><rect x="120" y="690" width="672" height="130" rx="22" fill="#DFF1E3" stroke="#9AD5B0" stroke-width="2"/><text x="154" y="744" class="l" fill="#1C6B3D">本地資料：原始影音、即時畫面、影像推論</text><text x="154" y="783" class="sm">只在裝置內使用，不進 Supabase、不進 AWS</text></g>
<rect x="900" y="245" width="300" height="650" rx="28" fill="#FFF3E9" stroke="#F4C18F" stroke-width="3" stroke-dasharray="11 8"/><text x="940" y="300" class="zt" fill="#F96C1A">知情觸發</text><text x="940" y="334" class="sm">什麼時候才離開家中</text><g><circle cx="1050" cy="470" r="80" fill="#F96C1A"/><path d="M1020 470h60m-30-30v60" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="975" y="600" class="l">主動按 SOS</text></g><g><circle cx="1050" cy="720" r="80" fill="#FFB14D"/><path d="M1012 720c18-25 57-25 76 0-19 25-58 25-76 0z" fill="none" stroke="#fff" stroke-width="7"/><circle cx="1050" cy="720" r="11" fill="#fff"/><text x="950" y="850" class="l">開口說話／確認要幫忙</text></g>
<rect x="1260" y="245" width="580" height="650" rx="28" class="z"/><text x="1300" y="300" class="zt" fill="#0E6EA8">雲端・只接收必要資料</text><text x="1300" y="334" class="sm">事件、逐字稿、派遣狀態</text><g><rect x="1300" y="390" width="240" height="150" rx="22" fill="#fff" stroke="#A7CDEA" stroke-width="2"/><rect x="1332" y="420" width="64" height="64" rx="15" fill="#4D9630"/><path d="M1344 456c5-22 36-23 42-4 14-3 20 20 4 25h-41c-14-4-12-20-5-21z" fill="none" stroke="#fff" stroke-width="5"/><text x="1418" y="448" class="l">IoT Core</text><text x="1418" y="480" class="sm">MQTT／事件</text></g><g><rect x="1570" y="390" width="240" height="150" rx="22" fill="#fff" stroke="#A7CDEA" stroke-width="2"/><rect x="1602" y="420" width="64" height="64" rx="15" fill="#FF9900"/><path d="M1625 436l10 22 11-22m-17 22l-11 21m17-21l12 21" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><text x="1688" y="448" class="l">Lambda</text><text x="1688" y="480" class="sm">狀態機／API</text></g><g><rect x="1300" y="610" width="510" height="170" rx="22" fill="#EAF4FC" stroke="#A7CDEA" stroke-width="2"/><text x="1334" y="660" class="l">資料最小化</text><text x="1334" y="704" class="sm">事件：SOS／疑似跌倒／物資需求</text><text x="1334" y="744" class="sm">語音：長輩主動說話後的必要逐字稿</text></g><path class="arr" d="M840 520H890"/><path class="arr" d="M1200 520H1250"/><text x="848" y="494" class="sm">只送必要資料</text><text x="88" y="1010" class="sm">設計底線：長輩永遠知道何時被連線、何時被求助、資料何時離開家。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>