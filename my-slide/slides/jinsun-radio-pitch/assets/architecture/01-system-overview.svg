<text x="88" y="74" class="eyebrow">金孫收音機 · 01 / 系統總覽</text><text x="88" y="137" class="title">從一句話，到有人真正到場</text><text x="88" y="181" class="sub">影像留在裝置端；語音、事件與派遣狀態才進入雲端。</text>
