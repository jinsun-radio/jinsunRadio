<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">四端角色與服務</title><desc id="desc">長輩、家屬、志工、社工四種角色透過各自 Flutter 端共用後端資料與事件流。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.h{font-size:29px}.l{font-size:22px}.sm{font-size:18px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 08 / 角色與權限</text><text x="88" y="137" class="t">每個角色看到的不是同一個畫面</text><text x="88" y="181" class="sub">共用事件資料，但依身分、責任與知情邊界呈現不同的下一步。</text>
<rect x="80" y="250" width="1280" height="640" rx="28" class="z"/><text x="120" y="300" class="h" fill="#0E6EA8">角色端・Flutter</text><g filter="url(#s)"><rect x="120" y="360" width="280" height="390" rx="24" fill="#FFF3E9" stroke="#F4C18F" stroke-width="2"/><circle cx="260" cy="430" r="48" fill="#F96C1A"/><path d="M238 436c0-19 43-19 43 0m-35-19c0-12 26-12 26 0" fill="none" stroke="#fff" stroke-width="6"/><text x="164" y="535" class="h">長輩端</text><text x="164" y="580" class="sm">大按鈕／語音回應</text><text x="164" y="620" class="sm">知道何時被連線</text><rect x="164" y="665" width="190" height="43" rx="14" fill="#fff"/><text x="190" y="693" class="sm">device identity</text></g><g filter="url(#s)"><rect x="450" y="360" width="280" height="390" rx="24" fill="#EAF4FC" stroke="#A7CDEA" stroke-width="2"/><circle cx="590" cy="430" r="48" fill="#1E88D6"/><path d="M563 436c0-19 43-19 43 0m-35-19c0-12 26-12 26 0" fill="none" stroke="#fff" stroke-width="6"/><text x="494" y="535" class="h">家屬</text><text x="494" y="580" class="sm">安心日報／緊急通知</text><text x="494" y="620" class="sm">只看綁定的長輩</text><rect x="494" y="665" width="190" height="43" rx="14" fill="#fff"/><text x="520" y="693" class="sm">family role</text></g><g filter="url(#s)"><rect x="780" y="360" width="280" height="390" rx="24" fill="#E8F5EC" stroke="#A9D9B7" stroke-width="2"/><circle cx="920" cy="430" r="48" fill="#2E9E5B"/><path d="M893 436c0-19 43-19 43 0m-35-19c0-12 26-12 26 0" fill="none" stroke="#fff" stroke-width="6"/><text x="824" y="535" class="h">志工</text><text x="824" y="580" class="sm">接單／導航／到場回報</text><text x="824" y="620" class="sm">只看可支援的任務</text><rect x="824" y="665" width="190" height="43" rx="14" fill="#fff"/><text x="850" y="693" class="sm">volunteer role</text></g><g filter="url(#s)"><rect x="1110" y="360" width="200" height="390" rx="24" fill="#F2ECF5" stroke="#CBB6D5" stroke-width="2"/><circle cx="1210" cy="430" r="48" fill="#9A6FA0"/><path d="M1183 436c0-19 43-19 43 0m-35-19c0-12 26-12 26 0" fill="none" stroke="#fff" stroke-width="6"/><text x="1154" y="535" class="h">社工</text><text x="1154" y="580" class="sm">監控／改派</text><text x="1154" y="620" class="sm">全局 dashboard</text><rect x="1154" y="665" width="125" height="43" rx="14" fill="#fff"/><text x="1171" y="693" class="sm">worker</text></g>
<rect x="1410" y="250" width="430" height="640" rx="28" class="z"/><text x="1450" y="300" class="h" fill="#0E6EA8">授權與共同能力</text><g filter="url(#s)"><rect x="1450" y="365" width="350" height="100" rx="20" class="card"/><rect x="1480" y="392" width="55" height="55" rx="14" fill="#FF9900"/><path d="M1495 408h26v18h-26zm4 18v13m9-13v13" fill="none" stroke="#fff" stroke-width="4"/><text x="1558" y="415" class="l">Cognito／Auth</text><text x="1558" y="445" class="sm">登入與角色</text></g><g filter="url(#s)"><rect x="1450" y="505" width="350" height="100" rx="20" class="card"/><rect x="1480" y="532" width="55" height="55" rx="14" fill="#3ECF8E"/><path d="M1492 547h31l-19 18h18l-20 19 5-14h-16z" fill="#fff"/><text x="1558" y="555" class="l">BackendClient</text><text x="1558" y="585" class="sm">Supabase／AWS 可切換</text></g><g filter="url(#s)"><rect x="1450" y="645" width="350" height="100" rx="20" class="card"/><rect x="1480" y="672" width="55" height="55" rx="14" fill="#E5484D"/><path d="M1492 704l12 12 22-25" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="1558" y="695" class="l">事件閉環</text><text x="1558" y="725" class="sm">通知／派遣／結案</text></g><path class="arr" d="M1365 570H1400"/><text x="88" y="1010" class="sm">身分不是 UI 標籤，而是資料可見範圍、能做的操作，以及必須被通知的責任。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>