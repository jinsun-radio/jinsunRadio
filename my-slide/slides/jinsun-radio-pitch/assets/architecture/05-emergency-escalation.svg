<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">20 秒緊急升級流程</title><desc id="desc">疑似跌倒事件經過語音確認、20 秒等待與 Step Functions 升級，最後通知家屬、志工和社工。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.l{font-size:23px}.sm{font-size:18px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.time{font-size:42px;font-weight:900;fill:#F96C1A}.num{font-size:23px;font-weight:900;fill:#fff}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 05 / 緊急流程</text><text x="88" y="137" class="t">20 秒內先確認，沒有回應就升級</text><text x="88" y="181" class="sub">時間不是背景設定，而是由 Step Functions 保證執行的照護承諾。</text>
<g filter="url(#s)"><rect x="90" y="360" width="250" height="270" rx="28" class="card"/><circle cx="215" cy="430" r="48" fill="#F96C1A"/><text x="198" y="442" class="num">1</text><text x="133" y="530" class="l">裝置事件</text><text x="133" y="565" class="sm">SOS／疑似跌倒</text><text x="133" y="600" class="sm">POST /voice</text></g><path class="arr" d="M350 495H420"/><g filter="url(#s)"><rect x="450" y="360" width="250" height="270" rx="28" class="card"/><circle cx="575" cy="430" r="48" fill="#FFB14D"/><text x="558" y="442" class="num">2</text><text x="493" y="530" class="l">語音確認</text><text x="493" y="565" class="sm">「你還好嗎？」</text><text x="493" y="600" class="sm">喇叭播報／回聽</text></g><path class="arr" d="M710 495H780"/><g filter="url(#s)"><rect x="810" y="330" width="300" height="330" rx="28" fill="#FFF3E9" stroke="#F4C18F" stroke-width="3"/><rect x="850" y="380" width="220" height="80" rx="18" fill="#7B4DCE"/><text x="884" y="432" font-size="27" fill="#fff" font-family="Noto Sans TC" font-weight="700">Step Functions</text><text x="870" y="530" class="time">20 秒</text><text x="856" y="578" class="sm">等待長輩回應</text><text x="856" y="615" class="sm">計時不受 App 開關影響</text></g><path class="arr" d="M1120 495H1190"/><g filter="url(#s)"><rect x="1220" y="360" width="250" height="270" rx="28" class="card"/><circle cx="1345" cy="430" r="48" fill="#E5484D"/><text x="1328" y="442" class="num">3</text><text x="1263" y="530" class="l">自動升級</text><text x="1263" y="565" class="sm">建立緊急派遣單</text><text x="1263" y="600" class="sm">通知責任角色</text></g><path class="arr" d="M1480 495H1550"/><g filter="url(#s)"><rect x="1580" y="300" width="260" height="390" rx="28" class="card"/><text x="1620" y="350" class="l">同步通知</text><rect x="1620" y="390" width="180" height="64" rx="16" fill="#EAF4FC"/><text x="1660" y="431" class="sm">家屬 App</text><rect x="1620" y="480" width="180" height="64" rx="16" fill="#E8F5EC"/><text x="1660" y="521" class="sm">志工 App</text><rect x="1620" y="570" width="180" height="64" rx="16" fill="#F2ECF5"/><text x="1660" y="611" class="sm">社工 Web</text></g>
<rect x="120" y="760" width="1680" height="130" rx="26" fill="#fff" stroke="#D9D1C8" stroke-width="2"/><text x="165" y="812" class="l">兩條出口</text><text x="390" y="812" class="sm">✓ 長輩回應「我沒事」 → 事件確認解除、留下趨勢紀錄</text><text x="1060" y="812" class="sm">⚠ 無回應 → 緊急升級、派遣志工、啟動進度播報</text><text x="165" y="853" class="sm">Step Functions 讓「App 關掉、網路短斷、社工尚未打開畫面」不會讓計時器消失。</text><text x="88" y="1010" class="sm">關鍵服務：AWS Step Functions ＋ Lambda ＋ IoT Core ＋ Supabase/Aurora 事件資料。</text><text x="1760" y="1010" font-size="16" fill="#756A60" font-family="Noto Sans TC">Noto Sans TC Bold</text></svg>