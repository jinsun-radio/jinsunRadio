<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">雙環境切換架構</title><desc id="desc">同一份 Flutter、Voice Agent 與資料模型支援 Supabase Render 主線和 AWS 平行環境。</desc><defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#FFB14D"/><stop offset=".45" stop-color="#F96C1A"/><stop offset="1" stop-color="#1E88D6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2814" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#58708A"/></marker><style><![CDATA[text{font-family:'Noto Sans TC','PingFang TC',sans-serif;font-weight:700;fill:#1C1712}.t{font-size:48px;font-weight:900}.sub{font-size:23px;fill:#5A5147}.e{font-size:19px;letter-spacing:4px;fill:#F96C1A}.h{font-size:28px}.l{font-size:22px}.sm{font-size:18px;fill:#5A5147}.card{fill:#fff;stroke:#E2DCD5;stroke-width:2}.arr{stroke:#58708A;stroke-width:4;fill:none;marker-end:url(#a)}.code{font-size:20px;font-family:'SF Mono','Menlo',monospace;fill:#0E6EA8}]]></style></defs><rect width="1920" height="1080" fill="#FBF9F6"/><rect width="1920" height="12" fill="url(#brand)"/><text x="88" y="74" class="e">金孫收音機 · 10 / 環境策略</text><text x="88" y="137" class="t">同一份程式碼，切換兩套雲</text><text x="88" y="181" class="sub">主線適合快速展示；AWS 平行環境提供完整雲原生部署。資料庫彼此隔離。</text>
<rect x="80" y="260" width="380" height="610" rx="28" class="z" fill="#EAF4FC"/><text x="118" y="310" class="h" fill="#0E6EA8">共同程式碼</text><g filter="url(#s)"><rect x="118" y="375" width="304" height="120" rx="22" class="card"/><rect x="150" y="405" width="60" height="60" rx="15" fill="#1E88D6"/><path d="M166 420h29v28h-29zM171 458h20" stroke="#fff" stroke-width="5" fill="none"/><text x="235" y="431" class="l">Flutter Apps</text><text x="235" y="462" class="sm">四端／同一 UI</text></g><g filter="url(#s)"><rect x="118" y="530" width="304" height="120" rx="22" class="card"/><rect x="150" y="560" width="60" height="60" rx="15" fill="#6E4DB7"/><path d="M162 593c7-18 27-18 35-5 10 1 11 15 1 20h-36c-9-4-8-13 0-15z" fill="#fff"/><text x="235" y="586" class="l">Voice Agent</text><text x="235" y="617" class="sm">Node.js／Agents</text></g><g><rect x="118" y="690" width="304" height="100" rx="20" fill="#F5F1EC"/><text x="150" y="733" class="code">BACKEND=aws</text><text x="150" y="765" class="sm">建置時選擇後端</text></g><path class="arr" d="M470 565H530"/>
<rect x="550" y="260" width="570" height="610" rx="28" fill="#E8F5EC" stroke="#A9D9B7" stroke-width="2"/><text x="590" y="310" class="h" fill="#2E9E5B">A・展示主線</text><text x="590" y="346" class="sm">Render＋Supabase＋MQTT broker</text><g filter="url(#s)"><rect x="590" y="390" width="228" height="125" rx="20" class="card"/><rect x="620" y="420" width="60" height="60" rx="15" fill="#111827"/><path d="M635 466l18-28 18 28z" fill="#fff"/><text x="700" y="442" class="l">Render</text><text x="700" y="473" class="sm">常駐 Voice</text></g><g filter="url(#s)"><rect x="850" y="390" width="228" height="125" rx="20" class="card"/><rect x="880" y="420" width="60" height="60" rx="15" fill="#3ECF8E"/><path d="M893 438h38l-22 21h21l-24 22 7-17h-19z" fill="#fff"/><text x="960" y="442" class="l">Supabase</text><text x="960" y="473" class="sm">Postgres／Realtime</text></g><g><rect x="590" y="560" width="488" height="170" rx="22" fill="#fff" stroke="#A9D9B7" stroke-width="2"/><text x="626" y="610" class="l">優點</text><text x="626" y="650" class="sm">✓ 最快跑通跨端 demo</text><text x="626" y="686" class="sm">✓ Realtime 立即同步</text><text x="626" y="722" class="sm">✓ 服務數量少、迭代快</text></g>
