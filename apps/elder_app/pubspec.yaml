name: jinsun_elder
description: "金孫收音機・長輩端網頁版（大錄音按鈕＋志工進度語音通知）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  jinsun_core:
    path: ../packages/core
  jinsun_ui_kit:
    path: ../packages/ui_kit
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  record: ^5.1.2       # 大錄音按鈕（web 走 MediaRecorder）
  flutter_tts: ^4.2.0 # 瀏覽器語音（國語 fallback；台語瀏覽器不支援）
  audioplayers: ^6.1.0 # 播放雲端 ATEN TTS 回的 WAV（跨源可播），台語靠這條

# 見 volunteer_app：record 端上壞掉的 record_linux，釘到相容版（web 不會用到）。
dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
